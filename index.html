<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>coder-app-name</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      /* 内联样式确保主题色立即生效，避免闪烁 */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      html.light,
      html.light body {
        background-color: #ffffff !important;
        color: #000000;
      }
      html.dark,
      html.dark body {
        background-color: #1a1a1a !important;
        color: #ffffff;
      }
    </style>
    <script>
      // 在 React 加载前立即设置主题，避免闪烁
      (function () {
        const isInIframe = window.self !== window.top;

        function applyThemeToDOM(theme) {
          document.documentElement.classList.remove("light", "dark");
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute("data-theme", theme);
        }

        if (isInIframe) {
          // 监听父窗口主动推送的主题消息
          window.addEventListener("message", function (event) {
            if (event.data && typeof event.data.theme === "string") {
              const theme = event.data.theme;
              if (theme === "light" || theme === "dark") {
                applyThemeToDOM(theme);
              }
            }
          });
        } else {
          // 非 iframe 环境，使用默认 light 主题
          applyThemeToDOM("light");
        }
      })();
    </script>
      <script>
      (function () {
        if (window.self === window.top) return;
        var reported = {};
        window.addEventListener("error", function (event) {
          // 资源加载失败的 error 事件没有 message，此处仅上报 JS 运行时错误
          if (!event || !event.message) return;
          var key =
            event.message + "|" + (event.filename || "") + "|" + (event.lineno || 0);
          if (reported[key]) return; // 相同错误只上报一次，避免渲染循环刷屏
          reported[key] = true;
          try {
            window.parent.postMessage(
              {
                type: "sandbox-runtime-error",
                payload: {
                  message: String(event.message).slice(0, 500),
                  filename: event.filename || "",
                  lineno: event.lineno || 0,
                  colno: event.colno || 0,
                  stack:
                    event.error && event.error.stack
                      ? String(event.error.stack).slice(0, 2000)
                      : ""
                }
              },
              "*"
            );
          } catch (e) {
            /* 上报失败不影响页面运行 */
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>


+++ index.html (修改后)
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anime City - GTA Style Action Game</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        overflow: hidden;
        background: #1a1a2e;
        font-family: 'Segoe UI', Arial, sans-serif;
      }
      #game-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      #ui-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 100;
      }
      .character-select {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
        pointer-events: auto;
        background: rgba(0,0,0,0.7);
        padding: 10px;
        border-radius: 10px;
      }
      .char-btn {
        width: 60px;
        height: 60px;
        border: 3px solid #444;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s;
        font-size: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #2a2a4a, #1a1a2e);
      }
      .char-btn:hover, .char-btn.active {
        border-color: #00d4ff;
        transform: scale(1.1);
        box-shadow: 0 0 20px rgba(0,212,255,0.5);
      }
      .hud {
        position: fixed;
        top: 20px;
        right: 20px;
        background: rgba(0,0,0,0.7);
        padding: 15px;
        border-radius: 10px;
        color: white;
        min-width: 200px;
      }
      .health-bar, .energy-bar {
        width: 100%;
        height: 20px;
        background: #333;
        border-radius: 10px;
        margin: 5px 0;
        overflow: hidden;
      }
      .health-fill {
        height: 100%;
        background: linear-gradient(90deg, #ff4444, #ff6666);
        transition: width 0.3s;
      }
      .energy-fill {
        height: 100%;
        background: linear-gradient(90deg, #4444ff, #6666ff);
        transition: width 0.3s;
      }
      .controls-hint {
        position: fixed;
        top: 20px;
        left: 20px;
        background: rgba(0,0,0,0.7);
        padding: 15px;
        border-radius: 10px;
        color: white;
        font-size: 12px;
        line-height: 1.6;
      }
      .ability-icons {
        position: fixed;
        bottom: 100px;
        right: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        pointer-events: auto;
      }
      .ability-btn {
        width: 50px;
        height: 50px;
        border: 2px solid #444;
        border-radius: 8px;
        cursor: pointer;
        background: rgba(0,0,0,0.7);
        color: white;
        font-size: 20px;
        transition: all 0.2s;
      }
      .ability-btn:hover {
        border-color: #00d4ff;
        transform: scale(1.1);
      }
      .ability-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      #loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #1a1a2e;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        color: white;
      }
      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid #333;
        border-top-color: #00d4ff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="loading-spinner"></div>
      <p style="margin-top: 20px;">Loading Anime City...</p>
    </div>
    <div id="game-container"></div>
    <div id="ui-overlay">
      <div class="controls-hint">
        <strong>Controls:</strong><br>
        WASD / Arrows - Move<br>
        Space - Jump<br>
        Left Click - Attack<br>
        1-4 - Special Abilities<br>
        Right Click - Block/Dash
      </div>
      <div class="hud">
        <div id="char-name">Character</div>
        <div class="health-bar"><div class="health-fill" id="health" style="width: 100%"></div></div>
        <div class="energy-bar"><div class="energy-fill" id="energy" style="width: 100%"></div></div>
        <div style="margin-top: 10px; font-size: 12px;">Score: <span id="score">0</span></div>
      </div>
      <div class="character-select" id="char-select"></div>
      <div class="ability-icons" id="abilities"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
